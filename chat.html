<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익명 이야기방 | 다시</title><link rel="stylesheet" href="site-refresh.css"><style>:root{--ink:#182638}body{margin:0;background:#f6f8fb;color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif}.frame{max-width:900px;margin:auto;padding:30px 20px}header{display:flex;align-items:center;justify-content:space-between}header a{color:#1759c8;text-decoration:none;font-weight:700}h1{font-size:clamp(29px,5vw,42px);letter-spacing:-1.7px;margin:35px 0 10px}p{color:#5d6b7e;line-height:1.8}.notice{background:#eef4ff;padding:17px;border-radius:14px;font-size:13px}.chat{margin:22px 0;background:white;border:1px solid #e1e7ee;border-radius:20px;padding:20px;min-height:320px;max-height:520px;overflow-y:auto}.msg{border-bottom:1px solid #edf1f6;padding:13px 0}.msg:last-child{border:0}.who{font-size:12px;color:#2160b9;font-weight:800}.at{font-size:11px;color:#9aa5b3;margin-left:10px}.content{margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}form{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid #d8e1eb;border-radius:12px;padding:15px;font:inherit;font-size:15px}button{border:0;background:#195ac9;color:#fff;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700}button:disabled{opacity:.5}.status{font-size:13px;min-height:25px;color:#596d82}@media(max-width:500px){form{flex-direction:column}button{width:100%}}</style></head><body><main class="frame"><header><a href="index.html">다시 ↗</a><a href="urgent.html">자금 탐색</a></header><h1>익명 이야기방</h1><p>혼자 고민하지 않아도 괜찮아요. 이름은 귀여운 별명으로 자동 생성돼요.</p><div class="notice">이 공간은 공개 대화방이에요. 이름·전화번호·계좌·주민번호·구체적인 채무내역을 올리지 마세요. 금융상품 권유나 사적 거래도 금지합니다. 현재는 시험 기능이며 전문 상담이 아닙니다.</div><div id="chat" class="chat" aria-live="polite"><p>대화 서버를 연결하면 메시지가 표시됩니다.</p></div><form id="send"><input id="message" maxlength="280" placeholder="서로에게 힘이 되는 이야기를 남겨요" autocomplete="off" aria-label="메시지"><button id="submit" disabled>보내기</button></form><div id="status" class="status"></div><p style="font-size:12px">개인정보를 입력하지 마세요. 메시지는 서버에서 최대 24시간 보관되며, 서버 설정에 따라 변경될 수 있습니다.</p></main><script src="site-config.js"></script><script src="chat.js"></script></body></html>
